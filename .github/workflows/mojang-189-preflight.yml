name: Mojang 1.8.9 Real-Client Preflight

on:
  pull_request:
    paths:
      - '.github/workflows/mojang-189-preflight.yml'
      - 'scripts/FetchMojang189Client.py'
      - 'platform-1.8.9/src/test/java/dev/trexzo/custommc/platform/v1_8_9/Minecraft189OfficialClientPreflightTest.java'
      - 'platform-1.8.9/src/main/java/dev/trexzo/custommc/platform/v1_8_9/Minecraft189Mappings.java'
      - 'platform-1.8.9/src/main/java/dev/trexzo/custommc/platform/v1_8_9/Minecraft189ClassShapeVerifier.java'
      - 'platform-1.8.9/src/main/java/dev/trexzo/custommc/platform/v1_8_9/Minecraft189ClassTransformer.java'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-client-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Download and SHA1-verify ephemeral Mojang client
        run: python scripts/FetchMojang189Client.py --output "$RUNNER_TEMP/minecraft-1.8.9-client.jar"
      - name: Verify exact native 1.8.9 raycast class bytes
        env:
          CUSTOMMC_189_REAL_CLIENT_REQUIRED: 'true'
          CUSTOMMC_189_REAL_CLIENT_JAR: ${{ runner.temp }}/minecraft-1.8.9-client.jar
        run: gradle --no-daemon :platform-1.8.9:test --tests 'dev.trexzo.custommc.platform.v1_8_9.Minecraft189OfficialClientPreflightTest'
      - name: Delete transient copyrighted client
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/minecraft-1.8.9-client.jar" "$RUNNER_TEMP/minecraft-1.8.9-client.jar.partial"
