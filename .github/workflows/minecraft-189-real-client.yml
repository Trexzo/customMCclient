  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-binary:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Offline asset-integrity regression tests (no network)
        run: python -m unittest discover -s scripts -p 'test_mojang189_*.py' -v
      - name: Fetch and verify official Mojang 1.8.9 client
        run: python scripts/FetchMojang189Client.py --output "$RUNNER_TEMP/minecraft-1.8.9-vanilla.jar"
      - name: Fetch SHA1 pinned real Mojang 1.8.9 dedicated server
        run: python scripts/FetchMojang189Server.py --output "$RUNNER_TEMP/minecraft-1.8.9-dedicated-server.jar"
      - name: Fetch and verify official Mojang 1.8.9 managed libraries
        run: python scripts/FetchMojang189Libraries.py --output-dir "$RUNNER_TEMP/minecraft-1.8.9-libraries"
      - name: Verify Linux natives and stage all 734 official Minecraft 1.8 assets
        timeout-minutes: 25
        run: python scripts/FetchMojang189NativeAssets.py --output-dir "$RUNNER_TEMP/minecraft-1.8.9-resources" --full-assets
      - name: Verify actual obfuscated class mappings and transformer hooks
        env:
          CUSTOMMC_189_REAL_CLIENT_REQUIRED: 'true'
          CUSTOMMC_189_REAL_CLIENT_JAR: ${{ runner.temp }}/minecraft-1.8.9-vanilla.jar
          CUSTOMMC_189_REAL_LIBRARIES_FILE: ${{ runner.temp }}/minecraft-1.8.9-libraries/classpath.txt
        run: gradle --no-daemon :platform-1.8.9:test --tests 'dev.trexzo.custommc.platform.v1_8_9.Minecraft189OfficialClientPreflightTest'
      - name: Build production Minecraft 1.8.9 runtime overlay
        run: gradle --no-daemon assembleRuntimeOverlay
      - name: Configure Java 8 for genuine Minecraft 1.8.9 graphics
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      # V304: the V302/V303 second/first native jobs timed out while apt
      # fetched recommended Openbox/X11 packages from the Ubuntu mirror.
      # Package/network setup is NOT a native Mojang gameplay stage.
      - name: Provision original X11 tools before native gameplay deadlines
        timeout-minutes: 12
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1 || ! command -v xrandr >/dev/null 2>&1 || \
             ! command -v xdotool >/dev/null 2>&1 || ! command -v openbox >/dev/null 2>&1; then
            sudo apt-get -o Acquire::Retries=2 update
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 install \
              -y --no-install-recommends --no-upgrade \
              xvfb x11-xserver-utils xdotool openbox
          fi
          command -v xvfb-run
          command -v xrandr
          command -v xdotool
          command -v openbox
          xvfb-run -a -s "-screen 0 1280x720x24" xrandr --query
      - name: Run offline singleplayer with genuine player and world Combat snapshots
        timeout-minutes: 4
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '2.1'
        run: |
          # All actual GUI tools were checked before this strict native timer.
          command -v xdotool
          command -v openbox
          xvfb-run -a -s "-screen 0 1280x720x24" python scripts/RunMojang189SingleplayerSmoke.py \
            --java "$JAVA_HOME/bin/java" \
            --client "$RUNNER_TEMP/minecraft-1.8.9-vanilla.jar" \
            --libraries "$RUNNER_TEMP/minecraft-1.8.9-libraries/classpath.txt" \
            --assets "$RUNNER_TEMP/minecraft-1.8.9-resources/assets" \
            --natives "$RUNNER_TEMP/minecraft-1.8.9-resources/natives" \
            --overlay "build/runtime-overlay" \
            --game "$RUNNER_TEMP/custommc-189-singleplayer" \
            --timeout 120 --native-world-camera --native-safe-walk
      - name: V94 genuine Mojang Step collision field and physical X11 ClickGUI keyboard focus
        timeout-minutes: 5
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '2.1'
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" python scripts/RunMojang189SingleplayerSmoke.py \
            --java "$JAVA_HOME/bin/java" \
            --client "$RUNNER_TEMP/minecraft-1.8.9-vanilla.jar" \
            --libraries "$RUNNER_TEMP/minecraft-1.8.9-libraries/classpath.txt" \
            --assets "$RUNNER_TEMP/minecraft-1.8.9-resources/assets" \
            --natives "$RUNNER_TEMP/minecraft-1.8.9-resources/natives" \
            --overlay "build/runtime-overlay" \
            --game "$RUNNER_TEMP/custommc-189-native-step-gui" \
            --timeout 180 --native-step-clickgui
      - name: V96 genuine Mojang NoClip collision lease via physical X11 ClickGUI
        timeout-minutes: 5
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '2.1'
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" python scripts/RunMojang189SingleplayerSmoke.py \
            --java "$JAVA_HOME/bin/java" \
            --client "$RUNNER_TEMP/minecraft-1.8.9-vanilla.jar" \
            --libraries "$RUNNER_TEMP/minecraft-1.8.9-libraries/classpath.txt" \
            --assets "$RUNNER_TEMP/minecraft-1.8.9-resources/assets" \
            --natives "$RUNNER_TEMP/minecraft-1.8.9-resources/natives" \
            --overlay "build/runtime-overlay" \
            --game "$RUNNER_TEMP/custommc-189-native-noclip-gui" \
            --timeout 180 --native-noclip-clickgui
      - name: V103 genuine original renderer ray Reach with physical X11 GUI focus
        timeout-minutes: 5
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '2.1'
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" python scripts/RunMojang189SingleplayerSmoke.py \
            --java "$JAVA_HOME/bin/java" \
            --client "$RUNNER_TEMP/minecraft-1.8.9-vanilla.jar" \
            --libraries "$RUNNER_TEMP/minecraft-1.8.9-libraries/classpath.txt" \
            --assets "$RUNNER_TEMP/minecraft-1.8.9-resources/assets" \
            --natives "$RUNNER_TEMP/minecraft-1.8.9-resources/natives" \
            --overlay "build/runtime-overlay" \
            --game "$RUNNER_TEMP/custommc-189-native-reach-gui" \
            --timeout 180 --native-reach-clickgui
      - name: V108 original native CombatSlot currentItem lease and physical ClickGUI focus
        timeout-minutes: 5
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '2.1'
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" python scripts/RunMojang189SingleplayerSmoke.py \
            --java "$JAVA_HOME/bin/java" \
            --client "$RUNNER_TEMP/minecraft-1.8.9-vanilla.jar" \
            --libraries "$RUNNER_TEMP/minecraft-1.8.9-libraries/classpath.txt" \
            --assets "$RUNNER_TEMP/minecraft-1.8.9-resources/assets" \
            --natives "$RUNNER_TEMP/minecraft-1.8.9-resources/natives" \
            --overlay "build/runtime-overlay" \
            --game "$RUNNER_TEMP/custommc-189-native-combatslot-gui" \
            --timeout 180 --native-combatslot-clickgui
      - name: V132 original Mojang fishing rod and potion discovery in genuine inventory with physical X11 GUI
        timeout-minutes: 5
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '2.1'
        run: |
