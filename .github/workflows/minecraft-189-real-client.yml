name: Official Minecraft 1.8.9 Binary Preflight

on:
  pull_request:
    paths:
      - '.github/workflows/minecraft-189-real-client.yml'
      - 'scripts/FetchMojang189Client.py'
      - 'scripts/FetchMojang189Server.py'
      - 'scripts/RunMojang189LocalhostTwoPlayerSmoke.py'
      - 'scripts/FetchMojang189Libraries.py'
      - 'scripts/FetchMojang189NativeAssets.py'
      - 'scripts/test_mojang189_complete_assets.py'
      - 'scripts/test_mojang189_server_spawn.py'
      - 'scripts/RunMojang189GraphicalSmoke.py'
      - 'scripts/RunMojang189SingleplayerSmoke.py'
      - 'platform-1.8.9/src/main/java/dev/trexzo/custommc/platform/v1_8_9/Minecraft189VanillaMeleeAcceptance.java'
      - 'bootstrap/src/main/java/dev/trexzo/custommc/bootstrap/TransformingTargetClassLoader.java'
      - 'platform-1.8.9/src/main/java/dev/trexzo/custommc/platform/v1_8_9/Minecraft189RuntimeBridge.java'
      - 'platform-1.8.9/src/main/java/dev/trexzo/custommc/platform/v1_8_9/Minecraft189FeatureCatalog.java'
      - 'platform-1.8.9/src/main/java/dev/trexzo/custommc/platform/v1_8_9/Minecraft189HostRuntime.java'
      - 'platform-1.8.9/src/main/java/dev/trexzo/custommc/platform/v1_8_9/Minecraft189WorldEntityVisibilityState.java'
      - 'platform-1.8.9/build.gradle.kts'
      - 'platform-1.8.9/src/main/java/dev/trexzo/custommc/platform/v1_8_9/Minecraft189ClassTransformer.java'
      - 'platform-1.8.9/src/main/java/dev/trexzo/custommc/platform/v1_8_9/Minecraft189ClassShapeVerifier.java'
      - 'platform-1.8.9/src/main/java/dev/trexzo/custommc/platform/v1_8_9/Minecraft189Mappings.java'
      - 'platform-1.8.9/src/test/java/dev/trexzo/custommc/platform/v1_8_9/Minecraft189OfficialClientPreflightTest.java'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-binary:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Offline asset-integrity regression tests (no network)
        run: python -m unittest discover -s scripts -p 'test_mojang189_*.py' -v
      - name: Fetch and verify official Mojang 1.8.9 client
        run: python scripts/FetchMojang189Client.py --output "$RUNNER_TEMP/minecraft-1.8.9-vanilla.jar"
      - name: Fetch SHA1 pinned real Mojang 1.8.9 dedicated server
        run: python scripts/FetchMojang189Server.py --output "$RUNNER_TEMP/minecraft-1.8.9-dedicated-server.jar"
      - name: Fetch and verify official Mojang 1.8.9 managed libraries
        run: python scripts/FetchMojang189Libraries.py --output-dir "$RUNNER_TEMP/minecraft-1.8.9-libraries"
      - name: Verify Linux natives and stage all 734 official Minecraft 1.8 assets
        timeout-minutes: 25
        run: python scripts/FetchMojang189NativeAssets.py --output-dir "$RUNNER_TEMP/minecraft-1.8.9-resources" --full-assets
      - name: Verify actual obfuscated class mappings and transformer hooks
        env:
          CUSTOMMC_189_REAL_CLIENT_REQUIRED: 'true'
          CUSTOMMC_189_REAL_CLIENT_JAR: ${{ runner.temp }}/minecraft-1.8.9-vanilla.jar
          CUSTOMMC_189_REAL_LIBRARIES_FILE: ${{ runner.temp }}/minecraft-1.8.9-libraries/classpath.txt
        run: gradle --no-daemon :platform-1.8.9:test --tests 'dev.trexzo.custommc.platform.v1_8_9.Minecraft189OfficialClientPreflightTest'
      - name: Build production Minecraft 1.8.9 runtime overlay
        run: gradle --no-daemon assembleRuntimeOverlay
      - name: Configure Java 8 for genuine Minecraft 1.8.9 graphics
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Ensure Xvfb and legacy LWJGL2 XRandR display enumeration
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1 || ! command -v xrandr >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb x11-xserver-utils
          fi
          command -v xvfb-run
          command -v xrandr
          xvfb-run -a -s "-screen 0 1280x720x24" xrandr --query
      - name: Prove production Aura scoped outgoing UUID guard vetoes mismatched real A intent, then damages B
        timeout-minutes: 6
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '2.1'
        run: |
          if ! command -v xdotool >/dev/null 2>&1 || ! command -v openbox >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xdotool openbox
          fi
          xvfb-run -a -s "-screen 0 1280x720x24" python scripts/RunMojang189LocalhostTwoPlayerSmoke.py \
            --java "$JAVA_HOME/bin/java" \
            --server "$RUNNER_TEMP/minecraft-1.8.9-dedicated-server.jar" \
            --client "$RUNNER_TEMP/minecraft-1.8.9-vanilla.jar" \
            --libraries "$RUNNER_TEMP/minecraft-1.8.9-libraries/classpath.txt" \
            --assets "$RUNNER_TEMP/minecraft-1.8.9-resources/assets" \
            --natives "$RUNNER_TEMP/minecraft-1.8.9-resources/natives" \
            --overlay "build/runtime-overlay" \
            --root "$RUNNER_TEMP/custommc-189-scoped-aura-owner-veto" \
            --timeout 235 --rejoin-release --require-index-reorder --require-wrong-target-veto --require-rejoined-controller-b --require-controller-entity-uuid --require-scoped-aura-owner-veto
      - name: Veto retained real B intent at native controller after genuine B disconnect, then damage A
        timeout-minutes: 6
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '2.1'
        run: |
          if ! command -v xdotool >/dev/null 2>&1 || ! command -v openbox >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xdotool openbox
          fi
          xvfb-run -a -s "-screen 0 1280x720x24" python scripts/RunMojang189LocalhostTwoPlayerSmoke.py \
            --java "$JAVA_HOME/bin/java" \
            --server "$RUNNER_TEMP/minecraft-1.8.9-dedicated-server.jar" \
            --client "$RUNNER_TEMP/minecraft-1.8.9-vanilla.jar" \
            --libraries "$RUNNER_TEMP/minecraft-1.8.9-libraries/classpath.txt" \
            --assets "$RUNNER_TEMP/minecraft-1.8.9-resources/assets" \
            --natives "$RUNNER_TEMP/minecraft-1.8.9-resources/natives" \
            --overlay "build/runtime-overlay" \
            --root "$RUNNER_TEMP/custommc-189-stale-dispatch-veto" \
            --timeout 235 --rejoin-release --require-index-reorder --require-wrong-target-veto --require-stale-dispatch-veto
      - name: Directly verify native attackEntity argument UUID B after real player rejoin and server damage
        timeout-minutes: 6
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '2.1'
        run: |
          if ! command -v xdotool >/dev/null 2>&1 || ! command -v openbox >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xdotool openbox
          fi
          xvfb-run -a -s "-screen 0 1280x720x24" python scripts/RunMojang189LocalhostTwoPlayerSmoke.py \
            --java "$JAVA_HOME/bin/java" \
            --server "$RUNNER_TEMP/minecraft-1.8.9-dedicated-server.jar" \
            --client "$RUNNER_TEMP/minecraft-1.8.9-vanilla.jar" \
            --libraries "$RUNNER_TEMP/minecraft-1.8.9-libraries/classpath.txt" \
            --assets "$RUNNER_TEMP/minecraft-1.8.9-resources/assets" \
            --natives "$RUNNER_TEMP/minecraft-1.8.9-resources/natives" \
            --overlay "build/runtime-overlay" \
            --root "$RUNNER_TEMP/custommc-189-controller-entity-uuid" \
            --timeout 235 --rejoin-release --require-index-reorder --require-wrong-target-veto --require-rejoined-controller-b --require-controller-entity-uuid
      - name: Prove actual post-rejoin Mojang controller hits UUID-locked B, server damages B and not surviving A
        timeout-minutes: 6
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '2.1'
        run: |
          if ! command -v xdotool >/dev/null 2>&1 || ! command -v openbox >/dev/null 2>&1; then
            sudo apt-get update
