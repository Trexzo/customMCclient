            --overlay "build/runtime-overlay" \
            --root "$RUNNER_TEMP/custommc-189-sticky-uuid-lock" \
            --timeout 235 --locked-target
      - name: Verify two SIMULTANEOUS real eligible UUID targets arbitrate and take separate damage
        timeout-minutes: 6
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '2.1'
        run: |
          # This step precedes M412's three-client test, so install the
