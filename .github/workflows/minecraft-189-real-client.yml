  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-binary:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Offline asset-integrity regression tests (no network)
        run: python -m unittest discover -s scripts -p 'test_mojang189_*.py' -v
      - name: Fetch and verify official Mojang 1.8.9 client
        run: python scripts/FetchMojang189Client.py --output "$RUNNER_TEMP/minecraft-1.8.9-vanilla.jar"
      - name: Fetch SHA1 pinned real Mojang 1.8.9 dedicated server
        run: python scripts/FetchMojang189Server.py --output "$RUNNER_TEMP/minecraft-1.8.9-dedicated-server.jar"
      - name: Fetch and verify official Mojang 1.8.9 managed libraries
        run: python scripts/FetchMojang189Libraries.py --output-dir "$RUNNER_TEMP/minecraft-1.8.9-libraries"
      - name: Verify Linux natives and stage all 734 official Minecraft 1.8 assets
        timeout-minutes: 25
        run: python scripts/FetchMojang189NativeAssets.py --output-dir "$RUNNER_TEMP/minecraft-1.8.9-resources" --full-assets
      - name: Verify actual obfuscated class mappings and transformer hooks
        env:
          CUSTOMMC_189_REAL_CLIENT_REQUIRED: 'true'
          CUSTOMMC_189_REAL_CLIENT_JAR: ${{ runner.temp }}/minecraft-1.8.9-vanilla.jar
          CUSTOMMC_189_REAL_LIBRARIES_FILE: ${{ runner.temp }}/minecraft-1.8.9-libraries/classpath.txt
        run: gradle --no-daemon :platform-1.8.9:test --tests 'dev.trexzo.custommc.platform.v1_8_9.Minecraft189OfficialClientPreflightTest'
      - name: Build production Minecraft 1.8.9 runtime overlay
        run: gradle --no-daemon assembleRuntimeOverlay
      - name: Configure Java 8 for genuine Minecraft 1.8.9 graphics
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Ensure Xvfb and legacy LWJGL2 XRandR display enumeration
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1 || ! command -v xrandr >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb x11-xserver-utils
          fi
          command -v xvfb-run
          command -v xrandr
          xvfb-run -a -s "-screen 0 1280x720x24" xrandr --query
      - name: Run offline singleplayer with genuine player and world Combat snapshots
        timeout-minutes: 4
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '2.1'
        run: |
          if ! command -v xdotool >/dev/null 2>&1 || ! command -v openbox >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xdotool openbox
          fi
          xvfb-run -a -s "-screen 0 1280x720x24" python scripts/RunMojang189SingleplayerSmoke.py \
            --java "$JAVA_HOME/bin/java" \
            --client "$RUNNER_TEMP/minecraft-1.8.9-vanilla.jar" \
            --libraries "$RUNNER_TEMP/minecraft-1.8.9-libraries/classpath.txt" \
            --assets "$RUNNER_TEMP/minecraft-1.8.9-resources/assets" \
            --natives "$RUNNER_TEMP/minecraft-1.8.9-resources/natives" \
            --overlay "build/runtime-overlay" \
            --game "$RUNNER_TEMP/custommc-189-singleplayer" \
            --timeout 120 --native-world-camera --native-safe-walk
      - name: V46 early strict original-client FOV evidence on genuine rear-player attack
        timeout-minutes: 4
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '2.1'
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" python scripts/RunMojang189LocalhostTwoPlayerSmoke.py \
            --java "$JAVA_HOME/bin/java" \
            --server "$RUNNER_TEMP/minecraft-1.8.9-dedicated-server.jar" \
            --client "$RUNNER_TEMP/minecraft-1.8.9-vanilla.jar" \
            --libraries "$RUNNER_TEMP/minecraft-1.8.9-libraries/classpath.txt" \
            --assets "$RUNNER_TEMP/minecraft-1.8.9-resources/assets" \
            --natives "$RUNNER_TEMP/minecraft-1.8.9-resources/natives" \
            --overlay "build/runtime-overlay" \
            --root "$RUNNER_TEMP/custommc-189-fov-early-diagnostic" \
            --timeout 170 --fov-veto
      - name: V47 early strict real A initial UUID lock then original B native controller and server damage
        timeout-minutes: 6
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '2.1'
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" python scripts/RunMojang189LocalhostTwoPlayerSmoke.py \
            --java "$JAVA_HOME/bin/java" \
            --server "$RUNNER_TEMP/minecraft-1.8.9-dedicated-server.jar" \
            --client "$RUNNER_TEMP/minecraft-1.8.9-vanilla.jar" \
            --libraries "$RUNNER_TEMP/minecraft-1.8.9-libraries/classpath.txt" \
            --assets "$RUNNER_TEMP/minecraft-1.8.9-resources/assets" \
            --natives "$RUNNER_TEMP/minecraft-1.8.9-resources/natives" \
            --overlay "build/runtime-overlay" \
            --root "$RUNNER_TEMP/custommc-189-controller-b-early" \
            --timeout 235 --rejoin-release --require-index-reorder --require-wrong-target-veto --require-rejoined-controller-b
      - name: V48 early strict original inventory E GUI veto with native source prearm evidence
        timeout-minutes: 6
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '2.1'
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" python scripts/RunMojang189LocalhostTwoPlayerSmoke.py \
            --java "$JAVA_HOME/bin/java" \
            --server "$RUNNER_TEMP/minecraft-1.8.9-dedicated-server.jar" \
            --client "$RUNNER_TEMP/minecraft-1.8.9-vanilla.jar" \
            --libraries "$RUNNER_TEMP/minecraft-1.8.9-libraries/classpath.txt" \
            --assets "$RUNNER_TEMP/minecraft-1.8.9-resources/assets" \
            --natives "$RUNNER_TEMP/minecraft-1.8.9-resources/natives" \
            --overlay "build/runtime-overlay" \
            --root "$RUNNER_TEMP/custommc-189-scaffold-dedicated-menu-open-early" \
            --timeout 210 --scaffold-placement menu-open
      - name: V11 prove genuine SafeWalk collision on elevated vanilla block ledge and negative control
        timeout-minutes: 9
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '2.1'
        run: |
          set -euo pipefail
          for state in enabled disabled; do
            xvfb-run -a -s "-screen 0 1280x720x24" python scripts/RunMojang189SingleplayerSmoke.py \
              --java "$JAVA_HOME/bin/java" \
              --client "$RUNNER_TEMP/minecraft-1.8.9-vanilla.jar" \
              --libraries "$RUNNER_TEMP/minecraft-1.8.9-libraries/classpath.txt" \
              --assets "$RUNNER_TEMP/minecraft-1.8.9-resources/assets" \
              --natives "$RUNNER_TEMP/minecraft-1.8.9-resources/natives" \
              --overlay "build/runtime-overlay" \
              --game "$RUNNER_TEMP/custommc-189-safewalk-$state" \
              --timeout 170 --safe-walk-edge "$state"
          done
      - name: V16 prove native original World air-stone-air server block transitions
        timeout-minutes: 5
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '2.1'
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" python scripts/RunMojang189SingleplayerSmoke.py \
            --java "$JAVA_HOME/bin/java" \
            --client "$RUNNER_TEMP/minecraft-1.8.9-vanilla.jar" \
            --libraries "$RUNNER_TEMP/minecraft-1.8.9-libraries/classpath.txt" \
            --assets "$RUNNER_TEMP/minecraft-1.8.9-resources/assets" \
            --natives "$RUNNER_TEMP/minecraft-1.8.9-resources/natives" \
            --overlay "build/runtime-overlay" \
            --game "$RUNNER_TEMP/custommc-189-scaffold-native-world" \
            --timeout 160 --native-scaffold-world
      - name: V18 prove same-tick original local player, World and selected ItemBlock
        timeout-minutes: 6
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '2.1'
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" python scripts/RunMojang189SingleplayerSmoke.py \
            --java "$JAVA_HOME/bin/java" \
            --client "$RUNNER_TEMP/minecraft-1.8.9-vanilla.jar" \
            --libraries "$RUNNER_TEMP/minecraft-1.8.9-libraries/classpath.txt" \
            --assets "$RUNNER_TEMP/minecraft-1.8.9-resources/assets" \
            --natives "$RUNNER_TEMP/minecraft-1.8.9-resources/natives" \
            --overlay "build/runtime-overlay" \
            --game "$RUNNER_TEMP/custommc-189-scaffold-native-tick" \
            --timeout 170 --native-scaffold-tick
      - name: V23 prove original Minecraft runTick player World cursor after real ItemBlock grant
        timeout-minutes: 6
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '2.1'
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" python scripts/RunMojang189SingleplayerSmoke.py \
            --java "$JAVA_HOME/bin/java" \
            --client "$RUNNER_TEMP/minecraft-1.8.9-vanilla.jar" \
            --libraries "$RUNNER_TEMP/minecraft-1.8.9-libraries/classpath.txt" \
            --assets "$RUNNER_TEMP/minecraft-1.8.9-resources/assets" \
            --natives "$RUNNER_TEMP/minecraft-1.8.9-resources/natives" \
            --overlay "build/runtime-overlay" \
            --game "$RUNNER_TEMP/custommc-189-scaffold-context-tick" \
            --timeout 170 --native-scaffold-context
      - name: V26 prove original native edge air target and adjacent support ray candidate
        timeout-minutes: 6
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '2.1'
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" python scripts/RunMojang189SingleplayerSmoke.py \
            --java "$JAVA_HOME/bin/java" \
            --client "$RUNNER_TEMP/minecraft-1.8.9-vanilla.jar" \
            --libraries "$RUNNER_TEMP/minecraft-1.8.9-libraries/classpath.txt" \
            --assets "$RUNNER_TEMP/minecraft-1.8.9-resources/assets" \
            --natives "$RUNNER_TEMP/minecraft-1.8.9-resources/natives" \
            --overlay "build/runtime-overlay" \
            --game "$RUNNER_TEMP/custommc-189-scaffold-candidate" \
            --timeout 170 --native-scaffold-candidate
      - name: V29 prove vanilla survival controller placement and client readback
        timeout-minutes: 6
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '2.1'
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" python scripts/RunMojang189SingleplayerSmoke.py \
            --java "$JAVA_HOME/bin/java" \
            --client "$RUNNER_TEMP/minecraft-1.8.9-vanilla.jar" \
            --libraries "$RUNNER_TEMP/minecraft-1.8.9-libraries/classpath.txt" \
            --assets "$RUNNER_TEMP/minecraft-1.8.9-resources/assets" \
            --natives "$RUNNER_TEMP/minecraft-1.8.9-resources/natives" \
            --overlay "build/runtime-overlay" \
            --game "$RUNNER_TEMP/custommc-189-scaffold-place-enabled" \
            --timeout 170 --native-scaffold-placement enabled
      - name: V37 certify two distinct original vanilla Scaffold clicks and dedicated-server stone+stone / six items
        timeout-minutes: 7
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '2.1'
        run: |
