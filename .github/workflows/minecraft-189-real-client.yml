            --timeout 235 --rejoin-release --require-index-reorder --require-wrong-target-veto
      - name: Prove real player rejoin ACTUALLY reorders loaded entity indices without stale UUID ownership
        timeout-minutes: 6
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '2.1'
        run: |
          if ! command -v xdotool >/dev/null 2>&1 || ! command -v openbox >/dev/null 2>&1; then
