      - 'scripts/FetchMojang189Server.py'
      - 'scripts/RunMojang189LocalhostTwoPlayerSmoke.py'
      - 'scripts/FetchMojang189Libraries.py'
      - 'scripts/FetchMojang189NativeAssets.py'
      - 'scripts/test_mojang189_complete_assets.py'
      - 'scripts/test_mojang189_server_spawn.py'
      - 'scripts/test_mojang189_workflow_acceptance_paths.py'
      - 'scripts/test_mojang189_x11_host_keys.py'
      - 'scripts/RunMojang189GraphicalSmoke.py'
      - 'scripts/RunMojang189SingleplayerSmoke.py'
      - 'platform-1.8.9/src/main/java/dev/trexzo/custommc/platform/v1_8_9/Minecraft189VanillaMeleeAcceptance.java'
      - 'bootstrap/src/main/java/dev/trexzo/custommc/bootstrap/TransformingTargetClassLoader.java'
      - 'platform-1.8.9/src/main/java/dev/trexzo/custommc/platform/v1_8_9/Minecraft189RuntimeBridge.java'
      - 'platform-1.8.9/src/main/java/dev/trexzo/custommc/platform/v1_8_9/Minecraft189RejoinTargetAcceptance.java'
      # V138: original-binary proof code MUST NOT run Foundation alone.
      # A witness rejecting or accepting a genuine live attack, rod, GUI,
      # world source or packet requires the full pinned Mojang suite.
      - 'platform-1.8.9/src/main/java/dev/trexzo/custommc/platform/v1_8_9/Minecraft189*Acceptance.java'
      - 'platform-1.8.9/src/test/java/dev/trexzo/custommc/platform/v1_8_9/Minecraft189*AcceptanceTest.java'
      - 'platform-1.8.9/src/test/java/dev/trexzo/custommc/platform/v1_8_9/Minecraft189SimultaneousPriorityRevalidationTest.java'
      # V281: the shipped original runtime includes bootstrap, core,
      # launcher and platform-api. Edits to these production modules or
      # runtime build wiring must exercise the genuine Mojang binary.
      - 'bootstrap/src/main/java/**'
      - 'core/src/main/java/**'
      - 'launcher/src/main/java/**'
      - 'platform-api/src/main/java/**'
      - 'bootstrap/build.gradle.kts'
      - 'core/build.gradle.kts'
      - 'launcher/build.gradle.kts'
      - 'platform-api/build.gradle.kts'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      # V279: Every original 1.8.9 platform production source edit must
      # trigger the real pinned binary, including non-Module native helpers.
      # Prior narrow allowlists missed 89/336 root-package Java sources.
      - 'platform-1.8.9/src/main/java/**'
      # V283: All platform test sources and supporting Java fixtures affect
      # original acceptance coverage, including the alternate package's
      # net.minecraft.client.main.Main test-only entrypoint. Any nested
      # test helper change must schedule the genuine Mojang CI.
      - 'platform-1.8.9/src/test/java/**'
      # V278: ALL 1.8.9 platform regression test-only edits must also
      # trigger the ACTUAL pinned original Minecraft binary suite.
      # Previous AcceptanceTest / Minecraft189*Test globs excluded eight
      # existing Legacy* / Lwjgl2* original native GUI tests.
      - 'platform-1.8.9/src/test/java/dev/trexzo/custommc/platform/v1_8_9/*Test.java'
      # A changed original-fixture Python test must also run the genuine
      # Mojang runtime; Foundation-only offline Python is insufficient.
      - 'scripts/test_mojang189_*.py'
      - 'platform-1.8.9/src/test/java/dev/trexzo/custommc/platform/v1_8_9/Minecraft189RejoinNativeUnloadTransitionTest.java'
      # V71: all real game-module implementation and settings changes must
      # run the SAME genuine Mojang binary/server suite, not Foundation only.
      - 'platform-1.8.9/src/main/java/dev/trexzo/custommc/platform/v1_8_9/Minecraft189*Module.java'
      - 'platform-1.8.9/src/main/java/dev/trexzo/custommc/platform/v1_8_9/Minecraft189*Feature.java'
      - 'platform-1.8.9/src/test/java/dev/trexzo/custommc/platform/v1_8_9/Minecraft189*ModuleTest.java'
