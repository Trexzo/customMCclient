            --overlay "build/runtime-overlay" \
            --root "$RUNNER_TEMP/custommc-189-real-rejoin" \
            --timeout 235 --rejoin-target
      - name: Verify sticky UUID target lock retains A while B nearer and releases to B on ineligibility
        timeout-minutes: 6
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '2.1'
        run: |
          if ! command -v xdotool >/dev/null 2>&1 || ! command -v openbox >/dev/null 2>&1; then
