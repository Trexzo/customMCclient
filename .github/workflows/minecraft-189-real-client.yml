            --overlay "build/runtime-overlay" \
            --root "$RUNNER_TEMP/custommc-189-index-reorder" \
            --timeout 235 --rejoin-release --require-index-reorder
      - name: Verify original A rejoin then actual B disconnect reacquires fresh A UUID and damages A
        timeout-minutes: 6
