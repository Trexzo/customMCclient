            --client "$RUNNER_TEMP/minecraft-1.8.9-vanilla.jar" \
            --libraries "$RUNNER_TEMP/minecraft-1.8.9-libraries/classpath.txt" \
            --assets "$RUNNER_TEMP/minecraft-1.8.9-resources/assets" \
            --natives "$RUNNER_TEMP/minecraft-1.8.9-resources/natives" \
            --overlay "build/runtime-overlay" \
            --root "$RUNNER_TEMP/custommc-189-survivor-release" \
            --timeout 235 --rejoin-release
      - name: Verify real target disconnect, fresh same-UUID rejoin and locked survivor
        timeout-minutes: 6
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '2.1'
        run: |
          if ! command -v xdotool >/dev/null 2>&1 || ! command -v openbox >/dev/null 2>&1; then
